name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-webkit
      - run: npx playwright install --with-deps webkit
      - run: npm test
      # Scripted vault pass against the anonymized fixture and the local fake
      # GitHub. Reuses the WebKit install above; npm test does not include
      # test/vault-pass/, so nothing runs twice.
      - name: Scripted vault pass
        env:
          CONFLICT_SHOTS: ${{ runner.temp }}/vault-pass-shots
        run: npm run test:vault-pass
      - name: Upload vault-pass failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vault-pass-shots
          path: ${{ runner.temp }}/vault-pass-shots
          if-no-files-found: ignore

  # GitHub Actions publishes Check Runs, not the legacy Statuses API.
  # Combined commit status stays pending with zero statuses, so PR-scoped
  # ci-passed listeners that watch GET /commits/{sha}/status never fire.
  ci-status:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const state = process.env.TEST_RESULT === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'test',
              description: state === 'success' ? 'Tests passed' : 'Tests failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
